[project]
name = "divar-mcp"
version = "0.1.0"
description = "MCP server for Divar (divar.ir), Iran's largest online marketplace"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "divar-mcp contributors" }]
keywords = ["mcp", "divar", "model-context-protocol", "iran", "marketplace"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dependencies = [
    "mcp[cli]>=1.9.0,<2.0",
    "httpx>=0.27",
    "tenacity>=9.0",
    "cachetools>=5.5",
    "beautifulsoup4>=4.12",
    "lxml>=5.2",
    "pydantic>=2.7",
    "jdatetime>=5.0",
]

[project.scripts]
divar-mcp = "divar_mcp.server:main"

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "respx>=0.21",
    "ruff>=0.6",
    "mypy>=1.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/divar_mcp"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["RUF001", "RUF002", "RUF003"]
"src/divar_mcp/services/nlp.py" = ["RUF001", "RUF002", "RUF003"]
"src/divar_mcp/services/detail.py" = ["RUF001", "RUF002", "RUF003"]
"src/divar_mcp/utils/persian.py" = ["RUF001", "RUF002", "RUF003"]
"src/divar_mcp/utils/price.py" = ["RUF001", "RUF002", "RUF003"]
"src/divar_mcp/config.py" = ["RUF001", "RUF002", "RUF003"]
"src/divar_mcp/services/search.py" = ["RUF001", "RUF002", "RUF003"]
"src/divar_mcp/services/matcher.py" = ["RUF001", "RUF002", "RUF003"]
"src/divar_mcp/services/comparison.py" = ["RUF001", "RUF002", "RUF003"]
"src/divar_mcp/services/discovery.py" = ["RUF001", "RUF002", "RUF003"]

[tool.mypy]
strict = true
python_version = "3.10"
mypy_path = "src"
packages = ["divar_mcp"]

[[tool.mypy.overrides]]
module = ["jdatetime.*", "cachetools.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
python_files = ["tests/**/*.py"]
pythonpath = ["src"]
addopts = "-v"
filterwarnings = []

[tool.coverage.run]
source = ["src/divar_mcp"]

[tool.coverage.report]
fail_under = 80
